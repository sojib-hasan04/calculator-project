<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="calculator-box">
    <h1>Calculator</h1>
    <input type="number" id="num1" placeholder="Number 1"><br>
    <input type="number" id="num2" placeholder="Number 2"><br>

    <div class="buttons">
        <button id="addBtn">Add</button>
        <button id="subBtn">Subtract</button>
        <button id="mulBtn">Multiply</button>
        <button id="divBtn">Divide</button>
    </div>

    <p>Folafol: <span id="result">0</span></p>
</div>

<script src="script.js"></script>
</body>
</html>
